name: Zbuduj APK

on:
  push:
    paths:
      - 'akordy/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Budowanie
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Przygotuj plik
        run: cp android/app/build/outputs/apk/release/app-release.apk TrenerAkordow.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrenerAkordow-apk
          path: TrenerAkordow.apk

      - name: Opublikuj w Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk TrenerAkordow.apk \
            --target "${{ github.sha }}" \
            --title "Trener akordów – APK (build ${{ github.run_number }})" \
            --notes "Pobierz TrenerAkordow.apk na telefon i otwórz plik. Android zapyta o zgodę na instalację z nieznanego źródła – zezwól. Aplikacja działa offline, prosi tylko o mikrofon."
