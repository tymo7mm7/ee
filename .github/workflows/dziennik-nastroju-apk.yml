name: Build Moj Dziennik APK

on:
  push:
    paths:
      - "dziennik-nastroju/**"
      - ".github/workflows/dziennik-nastroju-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dziennik-nastroju
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MojDziennik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MojDziennik-apk
          path: dziennik-nastroju/MojDziennik.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dziennik-nastroju-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Mój Dziennik ${{ github.run_number }}
          body: |
            Pobierz **MojDziennik.apk** poniżej i otwórz plik na telefonie z Androidem (8.0+).
            Jeśli telefon zapyta, zezwól na instalację z tego źródła.
          files: dziennik-nastroju/MojDziennik.apk
